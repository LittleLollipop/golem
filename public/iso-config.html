<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>假人配置 · FakeRen</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           margin: 0; padding: 24px; max-width: 860px; margin: 0 auto; line-height: 1.5; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px;
            background: var(--card, #fff); }
    .card.default { border-color: #2b8a5c; box-shadow: 0 0 0 2px rgba(43,138,92,.15); }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .name { font-weight: 600; }
    .tag { font-size: 12px; color: #2b8a5c; border: 1px solid #2b8a5c; border-radius: 6px; padding: 1px 6px; }
    .meta { font-size: 12px; color: #999; margin-top: 4px; }
    textarea { width: 100%; min-height: 70px; box-sizing: border-box; font: inherit; padding: 8px;
               border: 1px solid #ccc; border-radius: 8px; resize: vertical; }
    input { font: inherit; padding: 6px 8px; border: 1px solid #ccc; border-radius: 8px; }
    button { font: inherit; padding: 6px 12px; border: 1px solid #2b6cb0; background: #2b6cb0; color: #fff;
             border-radius: 8px; cursor: pointer; }
    button.ghost { background: #fff; color: #2b6cb0; }
    button.danger { border-color: #c0392b; background: #fff; color: #c0392b; }
    .hint { font-size: 12px; color: #b06; min-height: 16px; margin-top: 6px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>假人配置 · FakeRen</h1>
  <div class="sub">维度 I 多假人隔离 — 新建 / 列出假人、设定人格、选择默认实例。独立轻量 UI，不 patch dsh 核心。</div>

  <div class="card">
    <div class="row">
      <input id="newId" placeholder="实例 id（英文，如 linxia）" style="flex:1; min-width:160px" />
      <input id="newName" placeholder="显示名（如 林夏）" style="flex:1; min-width:140px" />
      <button id="createBtn">新建假人</button>
    </div>
    <div class="hint" id="createHint"></div>
  </div>

  <div id="list"></div>

  <script>
    const api = (p, opts) => fetch(p, opts).then(r => r.ok ? r.json().catch(()=>null) : Promise.reject(r.status));

    async function load() {
      const [metas, def] = await Promise.all([
        api("/instances/meta"),
        api("/config/default").catch(()=>({instanceId:null})),
      ]);
      const list = document.getElementById("list");
      list.innerHTML = "";
      const arr = (metas || []);
      if (arr.length === 0) {
        list.innerHTML = '<div class="meta">暂无实例，先在上方新建。</div>';
        return;
      }
      for (const m of arr) {
        const isDef = def && def.instanceId === m.id;
        const card = document.createElement("div");
        card.className = "card" + (isDef ? " default" : "");
        card.innerHTML = `
          <div class="row">
            <span class="name">${escapeHtml(m.name || m.id)}</span>
            <span class="meta">id: ${escapeHtml(m.id)} · turns: ${m.turns ?? 0}</span>
            ${isDef ? '<span class="tag">默认</span>' : ''}
          </div>
          <textarea data-id="${escapeHtml(m.id)}" placeholder="人格设定（第一人称，如：你是林夏……）">${escapeHtml(m.persona || "")}</textarea>
          <div class="row" style="margin-top:8px">
            <button class="ghost" data-act="save" data-id="${escapeHtml(m.id)}">保存人格</button>
            <button class="ghost" data-act="default" data-id="${escapeHtml(m.id)}">设为默认</button>
            <span class="hint" data-hint="${escapeHtml(m.id)}"></span>
          </div>`;
        list.appendChild(card);
      }
      list.querySelectorAll("button[data-act]").forEach(b => {
        b.onclick = () => onAct(b.dataset.act, b.dataset.id, b.closest(".card").querySelector("textarea").value);
      });
    }

    async function onAct(act, id, persona) {
      const hint = document.querySelector(`[data-hint="${id}"]`);
      try {
        if (act === "save") {
          const cur = (await api("/" + encodeURIComponent(id) + "/meta").catch(()=>({}))) || {};
          await api("/" + encodeURIComponent(id) + "/meta", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ ...cur, id, persona }),
          });
          hint.textContent = "已保存";
        } else if (act === "default") {
          await api("/config/default", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ instanceId: id }),
          });
          hint.textContent = "已设为默认";
        }
        setTimeout(load, 300);
      } catch (e) {
        hint.textContent = "失败: " + e;
      }
    }

    document.getElementById("createBtn").onclick = async () => {
      const id = document.getElementById("newId").value.trim();
      const name = document.getElementById("newName").value.trim();
      const hint = document.getElementById("createHint");
      if (!id) { hint.textContent = "请填 id"; return; }
      try {
        await api("/instance/create", { method: "POST", headers: {"content-type":"application/json"}, body: JSON.stringify({ id }) });
        await api("/" + encodeURIComponent(id) + "/meta", { method: "PUT", headers: {"content-type":"application/json"}, body: JSON.stringify({ id, name: name || id, createdAt: Date.now(), turns: 0 }) });
        hint.textContent = "已新建 " + id;
        document.getElementById("newId").value = "";
        document.getElementById("newName").value = "";
        setTimeout(load, 300);
      } catch (e) { hint.textContent = "失败: " + e; }
    };

    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }

    load();
  </script>
</body>
</html>
